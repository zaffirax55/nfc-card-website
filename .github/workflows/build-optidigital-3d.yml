name: Build isolated OptiDigital 3D copy
on:
  push:
    branches: [optidigital-3d-migration]
    paths:
      - 'migration/**'
      - '.github/workflows/build-optidigital-3d.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assemble OptiDigital copy with real Zaffirax GLBs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash migration/build-optidigital-3d.sh
