name: Verify real 3D in browser
on:
  push:
    branches: [optidigital-3d-preview]
    paths:
      - 'migration/verify-3d.mjs'
      - '.github/workflows/verify-3d.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build site and serve
        run: |
          npm run designer:build
          cd work/designer-preview-v36_2
          python3 -m http.server 8731 --bind 127.0.0.1 >/tmp/preview-web.log 2>&1 &
      - name: Verify model loads in Chromium
        run: node migration/verify-3d.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beauty-model-browser
          path: beauty-preview.png
