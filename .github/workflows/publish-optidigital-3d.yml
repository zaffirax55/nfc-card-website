name: Publish OptiDigital 3D preview to GitHub Pages
on:
  push:
    branches: [optidigital-3d-preview]
    paths:
      - '.github/workflows/publish-optidigital-3d.yml'
      - 'src/v36_2/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: optidigital-3d-pages
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build preview
        run: npm run designer:build
      - name: Validate copied GLB models
        run: |
          test "$(find work/designer-preview-v36_2/nfc-card-website/assets/models -type f -name '*.glb' | wc -l)" -eq 12
          test -f work/designer-preview-v36_2/nfc-card-website/assets/model-viewer.min.js
          test -f work/designer-preview-v36_2/nfc-card-website/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: work/designer-preview-v36_2/nfc-card-website
      - id: deploy
        uses: actions/deploy-pages@v4
