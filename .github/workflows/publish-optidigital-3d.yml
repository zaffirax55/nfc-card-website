name: Validate OptiDigital 3D preview (no publication)
on:
  push:
    branches: [optidigital-3d-preview, 'design/**', 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nfc-designer-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Build preview
        run: npm run designer:build
      - name: Validate copied GLB models
        run: |
          test "$(find work/designer-preview-v36_2/nfc-card-website/assets/models -type f -name '*.glb' | wc -l)" -eq 12
          test -f work/designer-preview-v36_2/nfc-card-website/assets/model-viewer.min.js
          test -f work/designer-preview-v36_2/nfc-card-website/index.html
      - name: Validate designer fixtures, contracts, transport and static output
        run: |
          npm run designer:seo
          npm run designer:test:contracts
          npm run designer:test:transport
          npm run designer:check
