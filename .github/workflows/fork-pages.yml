name: Deploy fork preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fork-pages-model-fix
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @google/model-viewer@4.4.0
          cp node_modules/@google/model-viewer/dist/model-viewer.min.js src/model-viewer.min.js
          test -s src/model-viewer.min.js
          python -m pip install --disable-pip-version-check numpy Pillow trimesh
          python scripts/build_review_card_fullbleed.py
          test -s src/nfc-review-card-3d.glb
      - name: Build fork preview
        env:
          NFC_ENV: production
          NFC_DEPLOYMENT_TARGET: github-pages
          NFC_PUBLIC_ORIGIN: https://zaffirax55.github.io
          NFC_PUBLIC_BASE_PATH: /nfc-card-website
          NFC_PUBLICATION_MODE: PUBLIC_PREVIEW
          NFC_TELEGRAM_ENABLED: 'false'
        run: npm run build
      - name: Checkout isolated OptiDigital 3D copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: optidigital-3d-preview
          path: optidigital-copy
          persist-credentials: false
      - name: Build and mount OptiDigital 3D as a separate preview
        run: |
          cd optidigital-copy
          npm run designer:build
          cd ..
          mkdir -p site/optidigital-3d
          cp -a optidigital-copy/work/designer-preview-v36_2/nfc-card-website/. site/optidigital-3d/
          python - <<'PY'
          from pathlib import Path
          root=Path('site/optidigital-3d')
          count=0
          for p in root.rglob('*'):
              if p.is_file() and p.suffix in {'.html','.mjs','.js','.css','.xml','.txt','.json'}:
                  raw=p.read_text(encoding='utf-8')
                  edited=(raw.replace('https://optidigitalagent.github.io','https://zaffirax55.github.io')
                      .replace('/nfc-card-website/','/nfc-card-website/optidigital-3d/')
                      .replace("'/nfc-card-website'", "'/nfc-card-website/optidigital-3d'"))
                  if edited != raw:
                      p.write_text(edited,encoding='utf-8')
                      count+=1
          assert (root/'assets/models/review-standard.glb').is_file()
          assert len(list((root/'assets/models').glob('*.glb')))==12
          assert (root/'assets/model-viewer.min.js').is_file()
          print('Published OptiDigital 3D preview assets; rewritten files:',count)
          PY
      - name: Disable Jekyll
        run: touch site/.nojekyll
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
